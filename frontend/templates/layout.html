<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilentVoice - Giving Every Gesture a Voice</title>
    <meta name="description" content="SilentVoice is a modern AI-powered bidirectional sign language recognition and voice transcription accessibility assistant.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS with cache-busting -->
    <link rel="stylesheet" href="/static/css/style.css?v=3.5">
    
    <!-- Critical Inline Light Theme Style Guard (ensures instant light mode regardless of caching) -->
    <style>
        :root, html, body {
            background-color: #F4F7FB !important;
            color: #475569 !important;
        }
        .navbar-glass, .status-bar-footer, .glass-card, .metric-card, .avatar-status-card {
            background-color: #FFFFFF !important;
        }
        .feed-viewport, .feed-viewport.avatar-view {
            background-color: #F1F5F9 !important;
        }
        .secondary-section, .sub-card, .chat-window {
            background-color: #F8FAFC !important;
        }
        h1, h2, h3, h4, h5, h6, .panel-title, .feed-placeholder-title {
            color: #172033 !important;
        }
    </style>
</head>
<body class="overflow-x-hidden">
    
    {% block content %}{% endblock %}

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script type="module" src="/static/js/app.js?v=3.5"></script>
</body>
</html>
